[project]
name = "yspec-plot"
version = "0.1.0"
description = "Pictures of what YSpec computes: seismograms and snapshots of the wavefield"
authors = [{name = "David Al-Attar"}]
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.11,<4",
    # The look of planetmodel's pictures, its sections, and maps through
    # cartopy.
    "planetmodel[plot,maps,netcdf]>=1.3.0,<2",
    "obspy (>=1.4)",
]

[project.scripts]
yspec-plot = "yspecplot.cli:main"

[tool.poetry]
packages = [{include = "yspecplot", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
