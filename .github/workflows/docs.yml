name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'YSpec/**'
      - 'src/**'
      - 'app/**'
      - 'examples/**'
      - 'tests/**'
      - 'README.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'YSpec/**'
      - 'src/**'
      - 'app/**'
      - 'examples/**'
      - 'tests/**'
      - 'README.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen python3
      - name: Build the manual and strict API
        run: python3 docs/tools/build_docs.py --output build/docs-ci
      - name: Check manual links, assets, anchors, fixtures and API pages
        run: python3 docs/tools/check_docs.py build/docs-ci/site

  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the verified example toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-13 libfftw3-dev libnetcdf-dev
      - name: Configure a Release/OpenMP build
        run: |
          cmake -S . -B build/docs-examples \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DYSPEC_BUILD_TESTS=ON
      - name: Build only the documented programs and library example
        run: cmake --build build/docs-examples --target yspec yspec-snapshot library_example --parallel 2
      - name: Run the library example
        run: OMP_NUM_THREADS=2 ctest --test-dir build/docs-examples -R '^example.library$' --output-on-failure
      - name: Run manual fixtures and the documented strain/kernel consumer
        run: python3 docs/tools/check_examples.py --build build/docs-examples
