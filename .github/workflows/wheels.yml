name: Wheels

# The Python package, yspec-seismo: wheels for Linux (x86_64 and aarch64) and
# macOS (arm64), and the source distribution, built on every change to the
# package and published to PyPI when a tag v* is pushed. Publishing uses
# PyPI's trusted publishing: the project on PyPI names this repository, this
# workflow and the environment "pypi", and no token is kept here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - python/**
      - .github/workflows/wheels.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v5
      # Built and tested as pyproject.toml's [tool.cibuildwheel] says.
      - uses: pypa/cibuildwheel@v3.4.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the source distribution
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
